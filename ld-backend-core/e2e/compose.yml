volumes:
  prometheus-data:
  cockroach_data1:
  cockroach_data2:
  cockroach_data3:
  pgdata:

networks:
  postgres_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24   # <-- Define the subnet range
          gateway: 10.5.0.1
  cockroach_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.1.0/24   # <-- Define the subnet range
          gateway: 10.5.1.1