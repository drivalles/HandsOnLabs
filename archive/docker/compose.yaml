services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: always
    command: -c 'max_connections=1000'
    networks:
      postgres_network:
        ipv4_address: 10.5.0.5
    ports:
      - "127.90.8.1:5432:5432"
      #- "192.168.0.103:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: 0n89ynyYNny0dfy0n8989uy

volumes:
  pgdata:

networks:
  postgres_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24